<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vote — RBSC 2026</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="header-fix.css"><link rel="stylesheet" href="rbsc.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="assets/rma-light.svg" alt="RMA"></a><nav><a href="rbsc.html">RBSC 2026</a></nav><a class="watch-button" href="rbsc.html">Contest hub</a></header><main class="rbsc-main"><p class="eyebrow">RBSC 2026</p><h2>Your audience choice.</h2><p class="vote-note">Ballot preview only — your selection is saved in this browser and is not an official counted vote.</p><div class="ballot" id="ballot"></div><div class="ballot-bar"><p id="selection">Select one broadcaster to continue.</p><button class="primary-button" id="submit" disabled>Save my choice</button></div><div class="vote-result" id="result" role="status"></div></main><script>const entries=[['🇦🇹','Austria','Austrian Ro-Broadcasting Corporation'],['🇪🇪','Estonia','ABU Television'],['🇸🇪','Sweden','Blue News Broadcast'],['🇦🇺','Australia','UBC'],['🇨🇭','Switzerland','SRB Network'],['🇳🇱','Netherlands','MavionTV'],['🇮🇩','Indonesia','SNO'],['🇫🇮','Finland','REV'],['🇬🇧','United Kingdom','NTV']];let picked=localStorage.getItem('rbsc-preview-vote')||'';const ballot=document.getElementById('ballot'),selection=document.getElementById('selection'),submit=document.getElementById('submit');function render(){ballot.innerHTML=entries.map(([flag,country,station])=>`<button class="entry ${picked===country?'selected':''}" data-country="${country}"><span class="flag">${flag}</span><h3>${country}</h3><p>${station}</p></button>`).join('');selection.textContent=picked?`Your choice: ${picked}`:'Select one broadcaster to continue.';submit.disabled=!picked}ballot.addEventListener('click',e=>{const button=e.target.closest('.entry');if(!button)return;picked=button.dataset.country;render()});submit.addEventListener('click',()=>{localStorage.setItem('rbsc-preview-vote',picked);const result=document.getElementById('result');result.textContent=`Saved: ${picked}. This preview does not submit an official RBSC vote.`;result.classList.add('show')});render()</script><script src="page-transitions.js"></script></body></html>
